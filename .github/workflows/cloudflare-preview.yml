name: Cloudflare Pages preview (Gate 2, non-production)

# Isolated PREVIEW pipeline for the private-source / public-deploy project.
#
# What this is NOT: it is not the production pipeline. pages.yml still owns notes.kakau.tw
# (GitHub Pages) and is untouched. This workflow never runs on push to main, never uses the
# Pages "production" branch, and builds with _config.preview.yml, which turns GoatCounter,
# the page-view counter and giscus off and points canonical/sitemap/feed at the preview URL.
#
# Gate order is deliberate: every test that pages.yml runs must pass BEFORE the deploy job can
# start (`needs: build-test`). A failing test therefore cannot publish anything, preview or not.

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-preview-${{ github.ref }}
  cancel-in-progress: true

env:
  # Name of the Cloudflare Pages *Direct Upload* project the owner creates (see
  # docs/operations/cloudflare-pages-preview.md). Not a secret.
  CF_PAGES_PROJECT: kakau-notes-preview
  # Canonical host the preview build declares for itself. Never notes.kakau.tw.
  PREVIEW_URL: https://kakau-notes-preview.pages.dev

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Write preview URL overlay
        run: |
          printf 'url: "%s"\n' "$PREVIEW_URL" > "$RUNNER_TEMP/preview-url.yml"

      - name: Build with Jekyll (production mode, preview overlay)
        run: >
          bundle exec jekyll build -d _site
          --config "_config.yml,_config.preview.yml,$RUNNER_TEMP/preview-url.yml"
        env:
          JEKYLL_ENV: production

      # --- Same quality gates as pages.yml. Do not weaken or reorder without changing both. ---
      - name: Test cross-subdomain attribution capture
        run: node --test tools/test_attribution.mjs

      - name: Test GoatCounter request minimisation and event names
        run: node --test tools/test_goatcounter.mjs

      - name: Check Kakau integration and internal links
        run: |
          bash tools/check_integration.sh
          bundle exec htmlproofer _site --disable-external --ignore-urls "/^http:\/\/127.0.0.1/,/^http:\/\/0.0.0.0/,/^http:\/\/localhost/"

      # --- Preview-only isolation checks (the overlay must really have taken effect). ---
      - name: Assert preview isolation
        run: |
          set -eu
          if grep -rIl "count.js\|giscus.app" _site; then
            echo "ERROR: preview build still loads GoatCounter count.js or giscus" >&2; exit 1
          fi
          grep -q "${PREVIEW_URL}/sitemap.xml" _site/robots.txt \
            || { echo "ERROR: robots.txt does not point at the preview sitemap" >&2; exit 1; }
          if grep -q "<loc>https://notes.kakau.tw" _site/sitemap.xml; then
            echo "ERROR: preview sitemap lists production URLs" >&2; exit 1
          fi

      # Written after the tests so htmlproofer never sees it. Keeps *.pages.dev out of search.
      - name: Mark preview as noindex
        run: |
          printf '/*\n  X-Robots-Tag: noindex, nofollow\n' > _site/_headers

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: preview-site
          path: _site
          retention-days: 7

  deploy-preview:
    needs: build-test
    runs-on: ubuntu-latest
    # Same-repo PRs and manual runs only. Never exposes Cloudflare credentials to a fork.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: preview-site
          path: _site

      - name: Check Cloudflare credentials are configured
        id: creds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set; build and tests passed, deploy skipped."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      # --branch is always a non-production alias, so this can only create *preview* deployments
      # on the Pages project. The project's production branch is deliberately never targeted.
      - name: Deploy preview to Cloudflare Pages (Direct Upload)
        if: steps.creds.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          set -eu
          branch="preview-$(printf '%s' "$HEAD_REF" | tr -c 'A-Za-z0-9' '-' | cut -c1-40)"
          npx --yes wrangler@4.20.0 pages deploy _site \
            --project-name="$CF_PAGES_PROJECT" \
            --branch="$branch" \
            --commit-hash="$GITHUB_SHA" \
            --commit-dirty=true
