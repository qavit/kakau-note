<svg xmlns="http://www.w3.org/2000/svg" width="460" height="740" viewBox="0 0 460 740" role="img" aria-labelledby="title desc">
  <title id="title">雙斜面兩物體的自由體圖</title>
  <desc id="desc">m1 與 m2 各自在斜面上受重力、正向力與沿斜面指向滑輪的張力。重力分解為沿斜面與垂直斜面的分量。沿斜面方向的方程式含有加速度，垂直斜面方向只決定正向力。</desc>
  <style>
    text { font-family: "Source Sans Pro", "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", "Noto Sans CJK TC", sans-serif; fill: #d4d7dd; font-size: 19px; }
    .strong { font-weight: 700; }
    .small { font-size: 16px; }
    .muted { fill: #a5aab4; }
  </style>
  <rect x="0.5" y="0.5" width="459" height="739" rx="14" fill="#1a1c21" stroke="#33353a"/>
  <text x="230.0" y="30.0" class="strong" text-anchor="middle" style="fill:#b7c6e6">對 <tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>m</tspan><tspan baseline-shift="sub" font-size="72%">1</tspan>（沿斜面向上為正）</text>
  <line x1="173.4" y1="263.8" x2="323.4" y2="63.8" stroke="#8a909c" stroke-width="2.4" stroke-linecap="round"/>
  <g transform="translate(230.0 150.0) rotate(-53)"><rect x="-38.0" y="-23.0" width="76" height="46" rx="4" fill="#1a2c32" stroke="#9bd7dd" stroke-width="2.4"/></g><text x="230.0" y="156.0" class="strong" text-anchor="middle" style="fill:#9bd7dd"></text>
  <line x1="230.0" y1="150.0" x2="230.0" y2="206.5" stroke="#b7c6e6" stroke-width="2.6" stroke-linecap="round"/><polygon points="230.0,217.5 225.4,206.5 234.6,206.5" fill="#b7c6e6"/>
  <text x="240.0" y="219.5" text-anchor="start"><tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>m</tspan><tspan baseline-shift="sub" font-size="72%">1</tspan> <tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>g</tspan></text>
  <line x1="230.0" y1="150.0" x2="206.4" y2="132.3" stroke="#b7c6e6" stroke-width="2.6" stroke-linecap="round"/><polygon points="197.6,125.7 209.2,128.6 203.6,136.0" fill="#b7c6e6"/>
  <text x="173.2" y="118.9" text-anchor="middle"><tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>N</tspan></text>
  <line x1="230.0" y1="150.0" x2="259.8" y2="110.2" stroke="#9bd7dd" stroke-width="3.2" stroke-linecap="round"/><polygon points="266.4,101.4 263.5,113.0 256.2,107.4" fill="#9bd7dd"/>
  <text x="277.2" y="93.0" class="strong" text-anchor="middle" style="fill:#9bd7dd"><tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>T</tspan></text>
  <line x1="230.0" y1="150.0" x2="197.6" y2="193.2" stroke="#a5aab4" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="5 5"/>
  <line x1="197.6" y1="193.2" x2="230.0" y2="217.5" stroke="#a5aab4" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 5"/>
  <text x="189.6" y="215.2" class="small" text-anchor="end" style="fill:#a5aab4"><tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>m</tspan><tspan baseline-shift="sub" font-size="72%">1</tspan> <tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>g</tspan> sin α</text>
  <text x="230.0" y="290.0" class="strong" text-anchor="middle" style="fill:#9bd7dd"><tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>T</tspan> − <tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>m</tspan><tspan baseline-shift="sub" font-size="72%">1</tspan> <tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>g</tspan> sin α = <tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>m</tspan><tspan baseline-shift="sub" font-size="72%">1</tspan> <tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>a</tspan></text>
  <text x="230.0" y="316.0" class="small" text-anchor="middle" style="fill:#a5aab4">垂直斜面：<tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>N</tspan> = <tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>m</tspan><tspan baseline-shift="sub" font-size="72%">1</tspan> <tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>g</tspan> cos α，不含 <tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>a</tspan></text>
  <text x="230.0" y="390.0" class="strong" text-anchor="middle" style="fill:#b7c6e6">對 <tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>m</tspan><tspan baseline-shift="sub" font-size="72%">2</tspan>（沿斜面向下為正）</text>
  <line x1="116.2" y1="453.4" x2="316.2" y2="603.4" stroke="#8a909c" stroke-width="2.4" stroke-linecap="round"/>
  <g transform="translate(230.0 510.0) rotate(37)"><rect x="-38.0" y="-23.0" width="76" height="46" rx="4" fill="#25272c" stroke="#a5aab4" stroke-width="2.4"/></g><text x="230.0" y="516.0" class="strong" text-anchor="middle" style="fill:#a5aab4"></text>
  <line x1="230.0" y1="510.0" x2="230.0" y2="620.5" stroke="#b7c6e6" stroke-width="2.6" stroke-linecap="round"/><polygon points="230.0,631.5 225.4,620.5 234.6,620.5" fill="#b7c6e6"/>
  <text x="240.0" y="633.5" text-anchor="start"><tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>m</tspan><tspan baseline-shift="sub" font-size="72%">2</tspan> <tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>g</tspan></text>
  <line x1="230.0" y1="510.0" x2="281.7" y2="441.0" stroke="#b7c6e6" stroke-width="2.6" stroke-linecap="round"/><polygon points="288.3,432.2 285.4,443.8 278.0,438.3" fill="#b7c6e6"/>
  <text x="299.1" y="421.8" text-anchor="middle"><tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>N</tspan></text>
  <line x1="230.0" y1="510.0" x2="190.2" y2="480.2" stroke="#9bd7dd" stroke-width="3.2" stroke-linecap="round"/><polygon points="181.4,473.6 193.0,476.5 187.4,483.8" fill="#9bd7dd"/>
  <text x="167.0" y="468.8" class="strong" text-anchor="middle" style="fill:#9bd7dd"><tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>T</tspan></text>
  <line x1="230.0" y1="510.0" x2="288.3" y2="553.7" stroke="#a5aab4" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="5 5"/>
  <line x1="288.3" y1="553.7" x2="230.0" y2="631.5" stroke="#a5aab4" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 5"/>
  <text x="296.3" y="577.7" class="small" text-anchor="start" style="fill:#a5aab4"><tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>m</tspan><tspan baseline-shift="sub" font-size="72%">2</tspan> <tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>g</tspan> sin β</text>
  <text x="230.0" y="660.0" class="strong" text-anchor="middle" style="fill:#9bd7dd"><tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>m</tspan><tspan baseline-shift="sub" font-size="72%">2</tspan> <tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>g</tspan> sin β − <tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>T</tspan> = <tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>m</tspan><tspan baseline-shift="sub" font-size="72%">2</tspan> <tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>a</tspan></text>
  <text x="230.0" y="686.0" class="small" text-anchor="middle" style="fill:#a5aab4">垂直斜面：<tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>N</tspan> = <tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>m</tspan><tspan baseline-shift="sub" font-size="72%">2</tspan> <tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>g</tspan> cos β，不含 <tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>a</tspan></text>
  <text x="230.0" y="718.0" class="small" text-anchor="middle" style="fill:#a5aab4">箭頭長度依本題數值按比例繪製；虛線為重力的分解</text>
</svg>
