<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
  <title id="title">雙斜面兩物體的自由體圖</title>
  <desc id="desc">m1 與 m2 各自在斜面上受重力、正向力與沿斜面指向滑輪的張力。重力分解為沿斜面與垂直斜面的分量。沿斜面方向的方程式含有加速度，垂直斜面方向只決定正向力。</desc>
  <style>
    text { font-family: "Source Sans Pro", "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", "Noto Sans CJK TC", sans-serif; fill: #d4d7dd; font-size: 17px; }
    .strong { font-weight: 700; }
    .small { font-size: 14px; }
    .muted { fill: #a5aab4; }
  </style>
  <rect x="0.5" y="0.5" width="999" height="499" rx="14" fill="#1a1c21" stroke="#33353a"/>
  <line x1="134.4" y1="400.8" x2="410.4" y2="32.8" stroke="#8a909c" stroke-width="2.4" stroke-linecap="round"/>
  <g transform="translate(250.0 200.0) rotate(-53)"><rect x="-48.0" y="-28.0" width="96" height="56" rx="4" fill="#1a2c32" stroke="#9bd7dd" stroke-width="2.4"/></g><text x="250.0" y="206.0" class="strong" text-anchor="middle" style="fill:#9bd7dd"></text>
  <line x1="250.0" y1="200.0" x2="250.0" y2="279.0" stroke="#b7c6e6" stroke-width="2.6" stroke-linecap="round"/><polygon points="250.0,290.0 245.4,279.0 254.6,279.0" fill="#b7c6e6"/>
  <text x="260.0" y="294.0" text-anchor="start"><tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>m</tspan><tspan baseline-shift="sub" font-size="72%">1</tspan> <tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>g</tspan></text>
  <line x1="250.0" y1="200.0" x2="215.6" y2="174.2" stroke="#b7c6e6" stroke-width="2.6" stroke-linecap="round"/><polygon points="206.8,167.6 218.4,170.5 212.8,177.9" fill="#b7c6e6"/>
  <text x="182.0" y="160.0" text-anchor="middle"><tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>N</tspan></text>
  <line x1="250.0" y1="200.0" x2="292.0" y2="144.0" stroke="#9bd7dd" stroke-width="3.2" stroke-linecap="round"/><polygon points="298.6,135.2 295.7,146.8 288.3,141.2" fill="#9bd7dd"/>
  <text x="308.2" y="126.4" class="strong" text-anchor="middle" style="fill:#9bd7dd"><tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>T</tspan></text>
  <line x1="250.0" y1="200.0" x2="206.8" y2="257.6" stroke="#a5aab4" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="5 5"/>
  <line x1="206.8" y1="257.6" x2="250.0" y2="290.0" stroke="#a5aab4" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 5"/>
  <text x="250.0" y="52.0" class="strong" text-anchor="middle" style="fill:#b7c6e6">對 <tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>m</tspan><tspan baseline-shift="sub" font-size="72%">1</tspan>（沿斜面向上為正）</text>
  <text x="192.8" y="277.6" class="small" text-anchor="end" style="fill:#a5aab4"><tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>m</tspan><tspan baseline-shift="sub" font-size="72%">1</tspan> <tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>g</tspan> sin α</text>
  <text x="250.0" y="440.0" class="strong" text-anchor="middle" style="fill:#9bd7dd"><tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>T</tspan> − <tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>m</tspan><tspan baseline-shift="sub" font-size="72%">1</tspan> <tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>g</tspan> sin α = <tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>m</tspan><tspan baseline-shift="sub" font-size="72%">1</tspan> <tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>a</tspan></text>
  <text x="250.0" y="466.0" class="small" text-anchor="middle" style="fill:#a5aab4">垂直斜面：<tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>N</tspan> = <tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>m</tspan><tspan baseline-shift="sub" font-size="72%">1</tspan> <tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>g</tspan> cos α（不含 <tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>a</tspan>）</text>
  <line x1="549.2" y1="84.4" x2="917.2" y2="360.4" stroke="#8a909c" stroke-width="2.4" stroke-linecap="round"/>
  <g transform="translate(750.0 200.0) rotate(37)"><rect x="-48.0" y="-28.0" width="96" height="56" rx="4" fill="#25272c" stroke="#a5aab4" stroke-width="2.4"/></g><text x="750.0" y="206.0" class="strong" text-anchor="middle" style="fill:#a5aab4"></text>
  <line x1="750.0" y1="200.0" x2="750.0" y2="351.0" stroke="#b7c6e6" stroke-width="2.6" stroke-linecap="round"/><polygon points="750.0,362.0 745.4,351.0 754.6,351.0" fill="#b7c6e6"/>
  <text x="760.0" y="366.0" text-anchor="start"><tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>m</tspan><tspan baseline-shift="sub" font-size="72%">2</tspan> <tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>g</tspan></text>
  <line x1="750.0" y1="200.0" x2="821.2" y2="105.1" stroke="#b7c6e6" stroke-width="2.6" stroke-linecap="round"/><polygon points="827.8,96.3 824.9,107.9 817.5,102.3" fill="#b7c6e6"/>
  <text x="825.4" y="85.5" text-anchor="middle"><tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>N</tspan></text>
  <line x1="750.0" y1="200.0" x2="694.0" y2="158.0" stroke="#9bd7dd" stroke-width="3.2" stroke-linecap="round"/><polygon points="685.2,151.4 696.8,154.3 691.2,161.7" fill="#9bd7dd"/>
  <text x="672.4" y="145.8" class="strong" text-anchor="middle" style="fill:#9bd7dd"><tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>T</tspan></text>
  <line x1="750.0" y1="200.0" x2="827.8" y2="258.3" stroke="#a5aab4" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="5 5"/>
  <line x1="827.8" y1="258.3" x2="750.0" y2="362.0" stroke="#a5aab4" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 5"/>
  <text x="750.0" y="52.0" class="strong" text-anchor="middle" style="fill:#b7c6e6">對 <tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>m</tspan><tspan baseline-shift="sub" font-size="72%">2</tspan>（沿斜面向下為正）</text>
  <text x="839.8" y="282.3" class="small" text-anchor="start" style="fill:#a5aab4"><tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>m</tspan><tspan baseline-shift="sub" font-size="72%">2</tspan> <tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>g</tspan> sin β</text>
  <text x="750.0" y="440.0" class="strong" text-anchor="middle" style="fill:#9bd7dd"><tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>m</tspan><tspan baseline-shift="sub" font-size="72%">2</tspan> <tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>g</tspan> sin β − <tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>T</tspan> = <tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>m</tspan><tspan baseline-shift="sub" font-size="72%">2</tspan> <tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>a</tspan></text>
  <text x="750.0" y="466.0" class="small" text-anchor="middle" style="fill:#a5aab4">垂直斜面：<tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>N</tspan> = <tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>m</tspan><tspan baseline-shift="sub" font-size="72%">2</tspan> <tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>g</tspan> cos β（不含 <tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>a</tspan>）</text>
  <text x="500.0" y="486.0" class="small" text-anchor="middle" style="fill:#a5aab4">箭頭長度依本題數值按比例繪製；虛線為重力沿斜面與垂直斜面的分解</text>
</svg>
