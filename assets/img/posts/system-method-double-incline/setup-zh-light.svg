<svg xmlns="http://www.w3.org/2000/svg" width="460" height="350" viewBox="0 0 460 350" role="img" aria-labelledby="title desc">
  <title id="title">雙斜面連結體示意圖</title>
  <desc id="desc">頂端有定滑輪的背靠背斜面：左側傾角 53 度的斜面上有 5 公斤的 m1，右側傾角 37 度的斜面上有 9 公斤的 m2，輕繩平行斜面連接兩者。m2 沿斜面下滑 q，m1 沿斜面上滑 q。</desc>
  <style>
    text { font-family: "Source Sans Pro", "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", "Noto Sans CJK TC", sans-serif; fill: #1f232b; font-size: 19px; }
    .strong { font-weight: 700; }
    .small { font-size: 16px; }
    .muted { fill: #555b66; }
  </style>
  <rect x="0.5" y="0.5" width="459" height="349" rx="14" fill="#ffffff" stroke="#d8d9dc"/>
  <polygon points="77.5,245.0 190,95 390.0,245.0" fill="#f1f2f4" stroke="#6b7280" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M 111.5 245.0 A 34 34 0 0 0 97.9 217.8" fill="none" stroke="#555b66" stroke-width="1.6"/>
  <text x="117.5" y="237.0" text-anchor="start" style="fill:#555b66">α</text>
  <path d="M 356.0 245.0 A 34 34 0 0 1 362.8 224.6" fill="none" stroke="#555b66" stroke-width="1.6"/>
  <text x="350.0" y="237.0" text-anchor="end" style="fill:#555b66">β</text>
  <line x1="190.0" y1="95.0" x2="185.6" y2="64.2" stroke="#6b7280" stroke-width="3" stroke-linecap="round"/>
  <line x1="133.0" y1="134.4" x2="185.6" y2="64.2" stroke="#0b1730" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="270.8" y1="128.1" x2="185.6" y2="64.2" stroke="#0b1730" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="185.6" cy="64.2" r="12" fill="#ffffff" stroke="#6b7280" stroke-width="2.4"/><circle cx="185.6" cy="64.2" r="3.5" fill="#6b7280"/>
  <g transform="translate(116.2 156.8) rotate(-53)"><rect x="-28.0" y="-20.0" width="56" height="40" rx="4" fill="#eef6f7" stroke="#216e84" stroke-width="2.4"/></g><text x="116.2" y="162.8" class="strong" text-anchor="middle" style="fill:#216e84"></text>
  <g transform="translate(293.2 144.9) rotate(37)"><rect x="-31.0" y="-20.0" width="62" height="40" rx="4" fill="#f1f2f4" stroke="#6b7280" stroke-width="2.4"/></g><text x="293.2" y="150.9" class="strong" text-anchor="middle" style="fill:#6b7280"></text>
  <text x="89.0" y="142.4" class="strong" text-anchor="end" style="fill:#216e84"><tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>m</tspan><tspan baseline-shift="sub" font-size="72%">1</tspan></text>
  <text x="313.6" y="123.7" class="strong" text-anchor="start" style="fill:#555b66"><tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>m</tspan><tspan baseline-shift="sub" font-size="72%">2</tspan></text>
  <line x1="48.6" y1="143.6" x2="78.0" y2="104.4" stroke="#216e84" stroke-width="2.6" stroke-linecap="round"/><polygon points="84.6,95.6 81.6,107.2 74.3,101.6" fill="#216e84"/>
  <text x="56.2" y="114.8" class="strong" text-anchor="end" style="fill:#216e84">+<tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>q</tspan></text>
  <line x1="306.4" y1="77.3" x2="345.6" y2="106.7" stroke="#216e84" stroke-width="2.6" stroke-linecap="round"/><polygon points="354.4,113.3 342.8,110.4 348.4,103.0" fill="#216e84"/>
  <text x="339.2" y="88.9" class="strong" text-anchor="start" style="fill:#216e84">+<tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>q</tspan></text>
  <text x="230.0" y="281.0" class="small" text-anchor="middle" style="fill:#555b66"><tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>m</tspan><tspan baseline-shift="sub" font-size="72%">1</tspan>：5 kg，α = 53°；<tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>m</tspan><tspan baseline-shift="sub" font-size="72%">2</tspan>：9 kg，β = 37°</text>
  <text x="230.0" y="305.0" class="small" text-anchor="middle" style="fill:#216e84">+<tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>q</tspan>：<tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>m</tspan><tspan baseline-shift="sub" font-size="72%">1</tspan> 沿斜面向上，<tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>m</tspan><tspan baseline-shift="sub" font-size="72%">2</tspan> 沿斜面向下</text>
</svg>
