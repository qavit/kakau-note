<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="t d" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif">
<title id="t">NO2 + NH3 + O2 → N2 + H2O 的解集合</title>
<desc id="d">固定 NH3 為 8、H2O 為 12 時，N2 的係數 d 可以是 4 到 7 之間任何值。兩端是只用 O2（R1）與只用 NO2（R2）的反應；d = 6 化簡後為 2:4:1:3:6，係數和 16，是段考答案；d = 5 得 2:8:4:5:12，係數和 31。</desc>
<rect width="760" height="420" rx="12" fill="#1a1c21"/>
<text x="32" y="40" font-size="20" font-weight="700" fill="#d4d7dd">NO<tspan dy="0.28em" font-size="72%">2</tspan><tspan dy="-0.28em"></tspan> ＋ NH<tspan dy="0.28em" font-size="72%">3</tspan><tspan dy="-0.28em"></tspan> ＋ O<tspan dy="0.28em" font-size="72%">2</tspan><tspan dy="-0.28em"></tspan> → N<tspan dy="0.28em" font-size="72%">2</tspan><tspan dy="-0.28em"></tspan> ＋ H<tspan dy="0.28em" font-size="72%">2</tspan><tspan dy="-0.28em"></tspan>O 的所有平衡式</text>
<text x="32" y="72" font-size="14" fill="#a5aab4">固定 NH<tspan dy="0.28em" font-size="72%">3</tspan><tspan dy="-0.28em"></tspan> ＝ 8、H<tspan dy="0.28em" font-size="72%">2</tspan><tspan dy="-0.28em"></tspan>O ＝ 12，橫軸是 N<tspan dy="0.28em" font-size="72%">2</tspan><tspan dy="-0.28em"></tspan> 的係數 d；線段上每一點都原子守恆</text>
<line x1="110" y1="200" x2="650" y2="200" stroke="#9bd7dd" stroke-width="5" stroke-linecap="round"/>
<circle cx="110" cy="200" r="9" fill="#1a1c21" stroke="#d4d7dd" stroke-width="2.5"/>
<text x="110" y="242" text-anchor="middle" font-size="16" font-weight="700" fill="#d4d7dd">d ＝ 4</text>
<text x="110" y="148" text-anchor="middle" font-size="15" fill="#d4d7dd" font-weight="400">0 : 8 : 6 : 4 : 12</text>
<text x="110" y="170" text-anchor="middle" font-size="13" fill="#a5aab4">R₁：沒有 NO₂</text>
<circle cx="290" cy="200" r="8" fill="#d4d7dd"/>
<text x="290" y="242" text-anchor="middle" font-size="16" font-weight="700" fill="#d4d7dd">d ＝ 5</text>
<text x="290" y="148" text-anchor="middle" font-size="15" fill="#d4d7dd" font-weight="400">2 : 8 : 4 : 5 : 12</text>
<text x="290" y="170" text-anchor="middle" font-size="13" fill="#a5aab4">係數和 31</text>
<circle cx="470" cy="200" r="8" fill="#d4d7dd"/>
<circle cx="470" cy="200" r="15" fill="none" stroke="#9bd7dd" stroke-width="2.5" stroke-dasharray="4 3"/>
<text x="470" y="242" text-anchor="middle" font-size="16" font-weight="700" fill="#d4d7dd">d ＝ 6</text>
<text x="470" y="148" text-anchor="middle" font-size="15" fill="#d4d7dd" font-weight="700">4 : 8 : 2 : 6 : 12</text>
<text x="470" y="170" text-anchor="middle" font-size="13" fill="#a5aab4">÷2 → 2 : 4 : 1 : 3 : 6，係數和 16</text>
<circle cx="650" cy="200" r="9" fill="#1a1c21" stroke="#d4d7dd" stroke-width="2.5"/>
<text x="650" y="242" text-anchor="middle" font-size="16" font-weight="700" fill="#d4d7dd">d ＝ 7</text>
<text x="650" y="148" text-anchor="middle" font-size="15" fill="#d4d7dd" font-weight="400">6 : 8 : 0 : 7 : 12</text>
<text x="650" y="170" text-anchor="middle" font-size="13" fill="#a5aab4">R₂：沒有 O₂</text>
<text x="470" y="124" text-anchor="middle" font-size="13" font-weight="700" fill="#9bd7dd">段考答案 (A)</text>
<text x="32" y="396" font-size="13" fill="#a5aab4">係數順序 a : b : c : d : e ＝ NO<tspan dy="0.28em" font-size="72%">2</tspan><tspan dy="-0.28em"></tspan> : NH<tspan dy="0.28em" font-size="72%">3</tspan><tspan dy="-0.28em"></tspan> : O<tspan dy="0.28em" font-size="72%">2</tspan><tspan dy="-0.28em"></tspan> : N<tspan dy="0.28em" font-size="72%">2</tspan><tspan dy="-0.28em"></tspan> : H<tspan dy="0.28em" font-size="72%">2</tspan><tspan dy="-0.28em"></tspan>O</text>
<defs><marker id="ah2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9bd7dd"/></marker></defs>
<line x1="217.99999999999994" y1="290" x2="632.0000000000001" y2="290" stroke="#9bd7dd" stroke-width="2" marker-end="url(#ah2)"/>
<text x="207.99999999999994" y="295" text-anchor="end" font-size="14" fill="#d4d7dd">NO<tspan dy="0.28em" font-size="72%">2</tspan><tspan dy="-0.28em"></tspan> 份量 a ＝ 2d − 8 增加</text>
<line x1="542.0" y1="326" x2="127.99999999999994" y2="326" stroke="#9bd7dd" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah2)"/>
<text x="552.0" y="331" font-size="14" fill="#d4d7dd">O<tspan dy="0.28em" font-size="72%">2</tspan><tspan dy="-0.28em"></tspan> 份量 c ＝ 14 − 2d 增加</text>
</svg>
