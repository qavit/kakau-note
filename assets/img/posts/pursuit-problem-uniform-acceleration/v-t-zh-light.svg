  <text x="598.4" y="379.3" class="small" text-anchor="middle" style="fill:#216e84">（被追回的差距）</text>
  <text x="790.8" y="96.2" class="strong" text-anchor="end" style="fill:#216e84">警車 <tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style="italic">v</tspan> = 20<tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style="italic">t</tspan></text>
  <text x="842.6" y="319.2" class="strong" text-anchor="end" style="fill:#555b66">賊車 <tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style="italic">v</tspan> = 16<tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style="italic">t</tspan></text>
</svg>
