  <text x="790.8" y="96.2" class="strong" text-anchor="end" style="fill:#9bd7dd">警車 <tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style="italic">v</tspan> = 20<tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style="italic">t</tspan></text>
  <text x="842.6" y="319.2" class="strong" text-anchor="end" style="fill:#a5aab4">賊車 <tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style="italic">v</tspan> = 16<tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style="italic">t</tspan></text>
