<svg xmlns="http://www.w3.org/2000/svg" width="460" height="350" viewBox="0 0 460 350" role="img" aria-labelledby="title desc">
  <title id="title">滑車問題示意圖</title>
  <desc id="desc">光滑水平桌面上的物體 A（5 公斤）以輕繩跨過桌邊定滑輪，連接垂掛的物體 B（10 公斤）。A 朝滑輪前進的位移與 B 下降的位移相同，都記為 q。</desc>
  <style>
    text { font-family: "Source Sans Pro", "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", "Noto Sans CJK TC", sans-serif; fill: #1f232b; font-size: 19px; }
    .strong { font-weight: 700; }
    .small { font-size: 16px; }
    .muted { fill: #555b66; }
  </style>
  <rect x="0.5" y="0.5" width="459" height="349" rx="14" fill="#ffffff" stroke="#d8d9dc"/>
  <rect x="16" y="200" width="276" height="20" fill="#f1f2f4" stroke="#6b7280" stroke-width="2"/>
  <text x="154.0" y="215.0" class="small" text-anchor="middle" style="fill:#555b66">光滑桌面</text>
  <line x1="292.0" y1="210.0" x2="312.0" y2="192.0" stroke="#6b7280" stroke-width="3" stroke-linecap="round"/>
  <circle cx="312.0" cy="192.0" r="20" fill="#ffffff" stroke="#6b7280" stroke-width="2.4"/><circle cx="312.0" cy="192.0" r="3.5" fill="#6b7280"/>
  <g transform="translate(140.0 172.0) rotate(0)"><rect x="-52.0" y="-28.0" width="104" height="56" rx="4" fill="#eef6f7" stroke="#216e84" stroke-width="2.4"/></g><text x="140.0" y="178.0" class="strong" text-anchor="middle" style="fill:#216e84">A  5 kg</text>
  <line x1="192.0" y1="172.0" x2="312.0" y2="172.0" stroke="#0b1730" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M 312 172 A 20 20 0 0 1 332 192" fill="none" stroke="#0b1730" stroke-width="2.4"/>
  <line x1="332.0" y1="192.0" x2="332.0" y2="252.0" stroke="#0b1730" stroke-width="2.4" stroke-linecap="round"/>
  <g transform="translate(332.0 288.0) rotate(0)"><rect x="-48.0" y="-36.0" width="96" height="72" rx="4" fill="#f1f2f4" stroke="#6b7280" stroke-width="2.4"/></g><text x="332.0" y="294.0" class="strong" text-anchor="middle" style="fill:#6b7280">B 10 kg</text>
  <line x1="96.0" y1="112.0" x2="173.0" y2="112.0" stroke="#216e84" stroke-width="2.6" stroke-linecap="round"/><polygon points="184.0,112.0 173.0,116.6 173.0,107.4" fill="#216e84"/>
  <text x="140.0" y="76.0" text-anchor="middle" style="fill:#216e84"><tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>x</tspan><tspan baseline-shift="sub" font-size="72%">A</tspan> = <tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>q</tspan></text>
  <text x="140.0" y="98.0" class="small" text-anchor="middle" style="fill:#216e84">朝滑輪為正</text>
  <line x1="262.0" y1="262.0" x2="262.0" y2="319.0" stroke="#216e84" stroke-width="2.6" stroke-linecap="round"/><polygon points="262.0,330.0 257.4,319.0 266.6,319.0" fill="#216e84"/>
  <text x="252.0" y="290.0" text-anchor="end" style="fill:#216e84"><tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>y</tspan><tspan baseline-shift="sub" font-size="72%">B</tspan> = <tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>q</tspan></text>
  <text x="252.0" y="312.0" class="small" text-anchor="end" style="fill:#216e84">向下為正</text>
</svg>
