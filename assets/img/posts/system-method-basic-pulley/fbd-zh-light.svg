<svg xmlns="http://www.w3.org/2000/svg" width="860" height="430" viewBox="0 0 860 430" role="img" aria-labelledby="title desc">
  <title id="title">A、B 的自由體圖</title>
  <desc id="desc">A 受重力、正向力與水平向右的張力；B 受向下的重力與向上的張力。A 以朝滑輪為正，B 以向下為正，分別寫出 T = m_A a 與 m_B g − T = m_B a。</desc>
  <style>
    text { font-family: "Source Sans Pro", "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", "Noto Sans CJK TC", sans-serif; fill: #1f232b; font-size: 17px; }
    .strong { font-weight: 700; }
    .small { font-size: 14px; }
    .muted { fill: #555b66; }
  </style>
  <rect x="0.5" y="0.5" width="859" height="429" rx="14" fill="#ffffff" stroke="#d8d9dc"/>
  <text x="230.0" y="52.0" class="strong" text-anchor="middle" style="fill:#0b1730">對 A（水平方向，朝滑輪為正）</text>
  <g transform="translate(230.0 215.0) rotate(0)"><rect x="-55.0" y="-33.0" width="110" height="66" rx="4" fill="#eef6f7" stroke="#216e84" stroke-width="2.4"/></g><text x="230.0" y="221.0" class="strong" text-anchor="middle" style="fill:#216e84">A</text>
  <line x1="230.0" y1="182.0" x2="230.0" y2="138.0" stroke="#0b1730" stroke-width="2.6" stroke-linecap="round"/><polygon points="230.0,127.0 234.6,138.0 225.4,138.0" fill="#0b1730"/>
  <text x="240.0" y="133.0" text-anchor="start"><tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>N</tspan></text>
  <line x1="230.0" y1="248.0" x2="230.0" y2="292.0" stroke="#0b1730" stroke-width="2.6" stroke-linecap="round"/><polygon points="230.0,303.0 225.4,292.0 234.6,292.0" fill="#0b1730"/>
  <text x="240.0" y="301.0" text-anchor="start"><tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>m</tspan><tspan baseline-shift="sub" font-size="72%">A</tspan> <tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>g</tspan></text>
  <line x1="285.0" y1="215.0" x2="332.7" y2="215.0" stroke="#216e84" stroke-width="3.2" stroke-linecap="round"/><polygon points="343.7,215.0 332.7,219.6 332.7,210.4" fill="#216e84"/>
  <text x="351.7" y="221.0" class="strong" text-anchor="start" style="fill:#216e84"><tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>T</tspan></text>
  <line x1="80.0" y1="120.0" x2="129.0" y2="120.0" stroke="#555b66" stroke-width="2" stroke-linecap="round"/><polygon points="140.0,120.0 129.0,124.6 129.0,115.4" fill="#555b66"/>
  <text x="80.0" y="110.0" class="small" text-anchor="start" style="fill:#555b66">正方向</text>
  <text x="230.0" y="385.0" class="strong" text-anchor="middle" style="fill:#216e84"><tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>T</tspan> = <tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>m</tspan><tspan baseline-shift="sub" font-size="72%">A</tspan> <tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>a</tspan></text>
  <text x="230.0" y="408.0" class="small" text-anchor="middle" style="fill:#555b66">鉛直方向 <tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>N</tspan> 與 <tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>m</tspan><tspan baseline-shift="sub" font-size="72%">A</tspan> <tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>g</tspan> 平衡，不提供加速度資訊</text>
  <text x="630.0" y="52.0" class="strong" text-anchor="middle" style="fill:#0b1730">對 B（鉛直方向，向下為正）</text>
  <g transform="translate(630.0 215.0) rotate(0)"><rect x="-45.0" y="-40.0" width="90" height="80" rx="4" fill="#f1f2f4" stroke="#6b7280" stroke-width="2.4"/></g><text x="630.0" y="221.0" class="strong" text-anchor="middle" style="fill:#6b7280">B</text>
  <line x1="630.0" y1="175.0" x2="630.0" y2="127.3" stroke="#216e84" stroke-width="3.2" stroke-linecap="round"/><polygon points="630.0,116.3 634.6,127.3 625.4,127.3" fill="#216e84"/>
  <text x="640.0" y="124.3" class="strong" text-anchor="start" style="fill:#216e84"><tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>T</tspan></text>
  <line x1="630.0" y1="255.0" x2="630.0" y2="343.0" stroke="#0b1730" stroke-width="2.6" stroke-linecap="round"/><polygon points="630.0,354.0 625.4,343.0 634.6,343.0" fill="#0b1730"/>
  <text x="640.0" y="352.0" text-anchor="start"><tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>m</tspan><tspan baseline-shift="sub" font-size="72%">B</tspan> <tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>g</tspan></text>
  <line x1="750.0" y1="175.0" x2="750.0" y2="224.0" stroke="#555b66" stroke-width="2" stroke-linecap="round"/><polygon points="750.0,235.0 745.4,224.0 754.6,224.0" fill="#555b66"/>
  <text x="760.0" y="201.0" class="small" text-anchor="start" style="fill:#555b66">正方向</text>
  <text x="630.0" y="385.0" class="strong" text-anchor="middle" style="fill:#216e84"><tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>m</tspan><tspan baseline-shift="sub" font-size="72%">B</tspan> <tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>g</tspan> − <tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>T</tspan> = <tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>m</tspan><tspan baseline-shift="sub" font-size="72%">B</tspan> <tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>a</tspan></text>
  <text x="630.0" y="408.0" class="small" text-anchor="middle" style="fill:#555b66">箭頭長度依本題數值大致按比例繪製</text>
</svg>
