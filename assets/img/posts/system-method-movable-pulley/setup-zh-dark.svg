<svg xmlns="http://www.w3.org/2000/svg" width="900" height="530" viewBox="0 0 900 530" role="img" aria-labelledby="title desc">
  <title id="title">動滑輪系統示意圖</title>
  <desc id="desc">繩的一端固定在天花板，向下繞過掛有 3 公斤物體的動滑輪，再向上繞過定滑輪，自由端垂下掛 2 公斤物體。動滑輪下有兩股繩，所以動滑輪上升 q 時，2 公斤物體下降 2q。</desc>
