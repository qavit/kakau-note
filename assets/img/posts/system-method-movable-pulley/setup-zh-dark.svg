  <line x1="290.0" y1="250.0" x2="290.0" y2="322.0" stroke="#8a909c" stroke-width="3" stroke-linecap="round"/>
  <g transform="translate(290.0 362.0) rotate(0)"><rect x="-40.0" y="-40.0" width="80" height="80" rx="4" fill="#1a2c32" stroke="#9bd7dd" stroke-width="2.4"/></g><text x="290.0" y="368.0" class="strong" text-anchor="middle" style="fill:#9bd7dd">3 kg</text>
  <text x="250.0" y="150.0" class="small" text-anchor="end" style="fill:#a5aab4">繩的一端固定</text>
  <text x="250.0" y="214.0" class="small" text-anchor="end" style="fill:#a5aab4">兩股繩支撐動滑輪</text>
  <text x="254.0" y="306.0" class="small" text-anchor="end" style="fill:#a5aab4">動滑輪</text>
  <text x="378.0" y="102.0" class="small" text-anchor="start" style="fill:#a5aab4">定滑輪</text>
