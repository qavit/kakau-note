  <text x="320.0" y="446.0" class="small" text-anchor="middle" style="fill:#9bd7dd">向下</text>
  <text x="230.0" y="478.0" class="small" text-anchor="middle" style="fill:#a5aab4">動滑輪下有兩股繩：2<tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>d</tspan><tspan baseline-shift="sub" font-size="72%">3</tspan> + <tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>d</tspan><tspan baseline-shift="sub" font-size="72%">2</tspan> = 常數</text>
</svg>
