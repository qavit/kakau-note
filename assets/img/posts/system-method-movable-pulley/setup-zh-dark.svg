  <circle cx="290.0" cy="250.0" r="26" fill="#1a1c21" stroke="#8a909c" stroke-width="2.4"/><circle cx="290.0" cy="250.0" r="3.5" fill="#8a909c"/>
  <line x1="364.0" y1="110.0" x2="364.0" y2="340.0" stroke="#b7c6e6" stroke-width="2.6" stroke-linecap="round"/>
