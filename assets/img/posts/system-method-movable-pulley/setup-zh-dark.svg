  <text x="70.0" y="396.0" class="strong" text-anchor="middle" style="fill:#9bd7dd"><tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>q</tspan></text>
  <text x="70.0" y="418.0" class="small" text-anchor="middle" style="fill:#9bd7dd">向上</text>
  <line x1="320.0" y1="300.0" x2="320.0" y2="389.0" stroke="#9bd7dd" stroke-width="2.6" stroke-linecap="round"/><polygon points="320.0,400.0 315.4,389.0 324.6,389.0" fill="#9bd7dd"/>
