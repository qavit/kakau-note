  <text x="40.0" y="500.0" class="strong" text-anchor="start" style="fill:#b7c6e6">繩長不變：2<tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>d</tspan><tspan baseline-shift="sub" font-size="72%">3</tspan> + <tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>d</tspan><tspan baseline-shift="sub" font-size="72%">2</tspan> = 常數  ⇒  動滑輪上升 <tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>q</tspan>，2 kg 下降 2<tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>q</tspan></text>
  <text x="40.0" y="522.0" class="small" text-anchor="start" style="fill:#a5aab4"><tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>d</tspan><tspan baseline-shift="sub" font-size="72%">3</tspan>：動滑輪的深度；<tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>d</tspan><tspan baseline-shift="sub" font-size="72%">2</tspan>：2 kg 物體自定滑輪下垂的長度</text>
</svg>
