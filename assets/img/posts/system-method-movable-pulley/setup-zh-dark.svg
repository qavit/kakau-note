c" stroke-width="1.2" stroke-linecap="round"/><line x1="312.0" y1="44.0" x2="300.0" y2="32.0" stroke="#8a909c" stroke-width="1.2" stroke-linecap="round"/><line x1="326.0" y1="44.0" x2="314.0" y2="32.0" stroke="#8a909c" stroke-width="1.2" stroke-linecap="round"/><line x1="340.0" y1="44.0" x2="328.0" y2="32.0" stroke="#8a909c" stroke-width="1.2" stroke-linecap="round"/><line x1="354.0" y1="44.0" x2="342.0" y2="32.0" stroke="#8a909c" stroke-width="1.2" stroke-linecap="round"/><line x1="368.0" y1="44.0" x2="356.0" y2="32.0" stroke="#8a909c" stroke-width="1.2" stroke-linecap="round"/><line x1="382.0" y1="44.0" x2="370.0" y2="32.0" stroke="#8a909c" stroke-width="1.2" stroke-linecap="round"/><line x1="396.0" y1="44.0" x2="384.0" y2="32.0" stroke="#8a909c" stroke-width="1.2" stroke-linecap="round"/>
