<svg xmlns="http://www.w3.org/2000/svg" width="460" height="750" viewBox="0 0 460 750" role="img" aria-labelledby="title desc">
  <title id="title">動滑輪兩物體的自由體圖</title>
  <desc id="desc">3 公斤物體由動滑輪兩側各一股張力向上拉，共 2T，重力 3g 向下，向上為正；2 公斤物體受向上的張力 T 與向下的重力 2g，向下為正，加速度為 2a。</desc>
  <style>
    text { font-family: "Source Sans Pro", "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", "Noto Sans CJK TC", sans-serif; fill: #d4d7dd; font-size: 19px; }
    .strong { font-weight: 700; }
    .small { font-size: 16px; }
    .muted { fill: #a5aab4; }
  </style>
  <rect x="0.5" y="0.5" width="459" height="749" rx="14" fill="#1a1c21" stroke="#33353a"/>
  <text x="230.0" y="30.0" class="strong" text-anchor="middle" style="fill:#b7c6e6">對 3 kg（向上為正）</text>
  <g transform="translate(230.0 170.0) rotate(0)"><rect x="-48.0" y="-35.0" width="96" height="70" rx="4" fill="#1a2c32" stroke="#9bd7dd" stroke-width="2.4"/></g><text x="230.0" y="176.0" class="strong" text-anchor="middle" style="fill:#9bd7dd">3 kg</text>
  <line x1="210.0" y1="135.0" x2="210.0" y2="88.7" stroke="#9bd7dd" stroke-width="3.2" stroke-linecap="round"/><polygon points="210.0,77.7 214.6,88.7 205.4,88.7" fill="#9bd7dd"/>
  <line x1="250.0" y1="135.0" x2="250.0" y2="88.7" stroke="#9bd7dd" stroke-width="3.2" stroke-linecap="round"/><polygon points="250.0,77.7 254.6,88.7 245.4,88.7" fill="#9bd7dd"/>
  <text x="200.0" y="85.7" class="strong" text-anchor="end" style="fill:#9bd7dd"><tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>T</tspan></text>
  <text x="260.0" y="85.7" class="strong" text-anchor="start" style="fill:#9bd7dd"><tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>T</tspan></text>
  <text x="230.0" y="65.7" class="small" text-anchor="middle" style="fill:#9bd7dd">共 2<tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>T</tspan></text>
  <line x1="230.0" y1="205.0" x2="230.0" y2="299.0" stroke="#b7c6e6" stroke-width="2.6" stroke-linecap="round"/><polygon points="230.0,310.0 225.4,299.0 234.6,299.0" fill="#b7c6e6"/>
  <text x="242.0" y="310.0" text-anchor="start">3<tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>g</tspan></text>
  <line x1="400.0" y1="200.0" x2="400.0" y2="151.0" stroke="#a5aab4" stroke-width="2" stroke-linecap="round"/><polygon points="400.0,140.0 404.6,151.0 395.4,151.0" fill="#a5aab4"/>
  <text x="400.0" y="128.0" class="small" text-anchor="middle" style="fill:#a5aab4">正方向</text>
  <text x="230.0" y="354.0" class="strong" text-anchor="middle" style="fill:#9bd7dd">2<tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>T</tspan> − 3<tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>g</tspan> = 3<tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>a</tspan></text>
  <text x="230.0" y="415.0" class="strong" text-anchor="middle" style="fill:#b7c6e6">對 2 kg（向下為正）</text>
  <g transform="translate(230.0 535.0) rotate(0)"><rect x="-40.0" y="-35.0" width="80" height="70" rx="4" fill="#25272c" stroke="#a5aab4" stroke-width="2.4"/></g><text x="230.0" y="541.0" class="strong" text-anchor="middle" style="fill:#a5aab4">2 kg</text>
  <line x1="230.0" y1="500.0" x2="230.0" y2="453.7" stroke="#9bd7dd" stroke-width="3.2" stroke-linecap="round"/><polygon points="230.0,442.7 234.6,453.7 225.4,453.7" fill="#9bd7dd"/>
  <text x="242.0" y="450.7" class="strong" text-anchor="start" style="fill:#9bd7dd"><tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>T</tspan></text>
  <line x1="230.0" y1="570.0" x2="230.0" y2="629.0" stroke="#b7c6e6" stroke-width="2.6" stroke-linecap="round"/><polygon points="230.0,640.0 225.4,629.0 234.6,629.0" fill="#b7c6e6"/>
  <text x="242.0" y="640.0" text-anchor="start">2<tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>g</tspan></text>
  <line x1="400.0" y1="505.0" x2="400.0" y2="554.0" stroke="#a5aab4" stroke-width="2" stroke-linecap="round"/><polygon points="400.0,565.0 395.4,554.0 404.6,554.0" fill="#a5aab4"/>
  <text x="400.0" y="493.0" class="small" text-anchor="middle" style="fill:#a5aab4">正方向</text>
  <text x="230.0" y="675.0" class="strong" text-anchor="middle" style="fill:#9bd7dd">2<tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>g</tspan> − <tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>T</tspan> = 2·(2<tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>a</tspan>) = 4<tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>a</tspan></text>
  <text x="230.0" y="701.0" class="small" text-anchor="middle" style="fill:#a5aab4">這個物體的加速度是 2<tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>a</tspan>，不是 <tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>a</tspan></text>
  <text x="230.0" y="729.0" class="small" text-anchor="middle" style="fill:#a5aab4">箭頭長度依本題數值按比例繪製</text>
</svg>
