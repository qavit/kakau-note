<svg xmlns="http://www.w3.org/2000/svg" width="860" height="480" viewBox="0 0 860 480" role="img" aria-labelledby="title desc">
  <title id="title">動滑輪兩物體的自由體圖</title>
  <desc id="desc">3 公斤物體由動滑輪兩側各一股張力向上拉，共 2T，重力 3g 向下，向上為正；2 公斤物體受向上的張力 T 與向下的重力 2g，向下為正，加速度為 2a。</desc>
  <style>
    text { font-family: "Source Sans Pro", "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", "Noto Sans CJK TC", sans-serif; fill: #d4d7dd; font-size: 17px; }
    .strong { font-weight: 700; }
    .small { font-size: 14px; }
    .muted { fill: #a5aab4; }
  </style>
  <rect x="0.5" y="0.5" width="859" height="479" rx="14" fill="#1a1c21" stroke="#33353a"/>
  <text x="230.0" y="50.0" class="strong" text-anchor="middle" style="fill:#b7c6e6">對 3 kg（動滑輪與物體，向上為正）</text>
  <g transform="translate(230.0 225.0) rotate(0)"><rect x="-48.0" y="-35.0" width="96" height="70" rx="4" fill="#1a2c32" stroke="#9bd7dd" stroke-width="2.4"/></g><text x="230.0" y="231.0" class="strong" text-anchor="middle" style="fill:#9bd7dd">3 kg</text>
  <line x1="212.0" y1="190.0" x2="212.0" y2="135.5" stroke="#9bd7dd" stroke-width="3.2" stroke-linecap="round"/><polygon points="212.0,124.5 216.6,135.5 207.4,135.5" fill="#9bd7dd"/>
  <line x1="248.0" y1="190.0" x2="248.0" y2="135.5" stroke="#9bd7dd" stroke-width="3.2" stroke-linecap="round"/><polygon points="248.0,124.5 252.6,135.5 243.4,135.5" fill="#9bd7dd"/>
  <text x="202.0" y="128.5" class="strong" text-anchor="end" style="fill:#9bd7dd"><tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>T</tspan></text>
  <text x="258.0" y="128.5" class="strong" text-anchor="start" style="fill:#9bd7dd"><tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>T</tspan></text>
  <text x="230.0" y="110.5" class="small" text-anchor="middle" style="fill:#9bd7dd">共 2<tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>T</tspan></text>
  <line x1="230.0" y1="260.0" x2="230.0" y2="369.0" stroke="#b7c6e6" stroke-width="2.6" stroke-linecap="round"/><polygon points="230.0,380.0 225.4,369.0 234.6,369.0" fill="#b7c6e6"/>
  <text x="242.0" y="380.0" text-anchor="start">3<tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>g</tspan></text>
  <line x1="330.0" y1="245.0" x2="330.0" y2="196.0" stroke="#a5aab4" stroke-width="2" stroke-linecap="round"/><polygon points="330.0,185.0 334.6,196.0 325.4,196.0" fill="#a5aab4"/>
  <text x="340.0" y="215.0" class="small" text-anchor="start" style="fill:#a5aab4">正方向</text>
  <text x="230.0" y="428.0" class="strong" text-anchor="middle" style="fill:#9bd7dd">2<tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>T</tspan> − 3<tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>g</tspan> = 3<tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>a</tspan></text>
  <text x="640.0" y="50.0" class="strong" text-anchor="middle" style="fill:#b7c6e6">對 2 kg（向下為正）</text>
  <g transform="translate(640.0 225.0) rotate(0)"><rect x="-40.0" y="-35.0" width="80" height="70" rx="4" fill="#25272c" stroke="#a5aab4" stroke-width="2.4"/></g><text x="640.0" y="231.0" class="strong" text-anchor="middle" style="fill:#a5aab4">2 kg</text>
  <line x1="640.0" y1="190.0" x2="640.0" y2="135.5" stroke="#9bd7dd" stroke-width="3.2" stroke-linecap="round"/><polygon points="640.0,124.5 644.6,135.5 635.4,135.5" fill="#9bd7dd"/>
  <text x="652.0" y="128.5" class="strong" text-anchor="start" style="fill:#9bd7dd"><tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>T</tspan></text>
  <line x1="640.0" y1="260.0" x2="640.0" y2="329.0" stroke="#b7c6e6" stroke-width="2.6" stroke-linecap="round"/><polygon points="640.0,340.0 635.4,329.0 644.6,329.0" fill="#b7c6e6"/>
  <text x="652.0" y="340.0" text-anchor="start">2<tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>g</tspan></text>
  <line x1="740.0" y1="185.0" x2="740.0" y2="234.0" stroke="#a5aab4" stroke-width="2" stroke-linecap="round"/><polygon points="740.0,245.0 735.4,234.0 744.6,234.0" fill="#a5aab4"/>
  <text x="750.0" y="215.0" class="small" text-anchor="start" style="fill:#a5aab4">正方向</text>
  <text x="640.0" y="428.0" class="strong" text-anchor="middle" style="fill:#9bd7dd">2<tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>g</tspan> − <tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>T</tspan> = 2·(2<tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>a</tspan>) = 4<tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>a</tspan></text>
  <text x="640.0" y="452.0" class="small" text-anchor="middle" style="fill:#a5aab4">加速度是 2<tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>a</tspan>，不是 <tspan font-family='"STIX Two Text", "Latin Modern Roman", "Times New Roman", serif' font-style='italic'>a</tspan></text>
  <text x="230.0" y="452.0" class="small" text-anchor="middle" style="fill:#a5aab4">箭頭長度依本題數值按比例繪製</text>
</svg>
